name: example
title: Example instrument
description: A short instrument asking the bank template's questions, to copy or delete.
universe: tpl.all_respondents
uses:
  tpl: JHUCities/qretools-bank-template@v1
inputs:
  form:
    responses:
      "1": Form A
      "2": Form B
    description: Which half of the response-order experiment, assigned before the interview.
flow:
  - say: Thank you for taking part. This survey takes about five minutes.
  - section: The service
    flow:
      - ask: tpl.service_satisfaction
      - if: tpl.service_satisfaction in {"4", "5"}
        then:
          - ask: tpl.service_comments
            universe: Respondents dissatisfied with the service
  - section: Libraries and parks
    flow:
      - ask: tpl.library_visits
        checks:
          - ensure: tpl.library_visits < 25
            severity: info
            message: "{{tpl.library_visits}} days is most of the month. Is that right?"
      - if: form = "1"
        then:
          - ask: tpl.parks_spending
            universe: Respondents on form A
        else:
          - ask: tpl.parks_spending_reversed
            universe: Respondents on form B
  - ask: tpl.news_sources
