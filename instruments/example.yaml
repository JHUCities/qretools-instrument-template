name: example
title: Example instrument
description: A short instrument asking the example bank's questions, to copy or delete.
universe: ex.all_respondents
uses:
  ex: ../banks/example
inputs:
  form:
    responses:
      "1": Form A
      "2": Form B
    description: Which half of the response-order experiment, assigned before the interview.
flow:
  - say: Thank you for taking part. This survey takes about five minutes.
  - section: The service
    flow:
      - ask: ex.service_satisfaction
      - if: ex.service_satisfaction in {"4", "5"}
        then:
          - ask: ex.service_comments
            universe: Respondents dissatisfied with the service
  - section: Libraries and parks
    flow:
      - ask: ex.library_visits
        checks:
          - ensure: ex.library_visits < 25
            severity: info
            message: "{{ex.library_visits}} days is most of the month. Is that right?"
      - if: form = "1"
        then:
          - ask: ex.parks_spending
            universe: Respondents on form A
        else:
          - ask: ex.parks_spending_reversed
            universe: Respondents on form B
  - ask: ex.news_sources
